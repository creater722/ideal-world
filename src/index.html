<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理想的世界</title>
<style>
  :root {
    --ink: #f6f1e2;
    --ink-dim: rgba(246, 241, 226, .60);
    --line: rgba(246, 241, 226, .26);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0d100b; overflow: hidden;
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  }
  body.playing { cursor: none; }

  /* 空气感：暖光溢出 + 暗角，与后处理叠加但不喧宾夺主 */
  #grade {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(88% 68% at 74% 6%, rgba(255, 236, 186, .10), rgba(255, 236, 186, 0) 62%),
      radial-gradient(128% 108% at 50% 48%, rgba(0, 0, 0, 0) 46%, rgba(16, 20, 12, .30) 100%);
    mix-blend-mode: multiply;
  }

  .layer {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease;
  }
  .hidden { display: none !important; }

  /* 开场 */
  #intro {
    background:
      radial-gradient(120% 100% at 50% 112%, rgba(10, 14, 9, .84), rgba(10, 14, 9, .28) 58%),
      linear-gradient(180deg, rgba(7, 10, 6, .60), rgba(7, 10, 6, .22) 40%, rgba(7, 10, 6, .78));
  }
  #intro.dismiss { opacity: 0; pointer-events: none; }
  .intro-inner { text-align: center; padding: 0 28px; transform: translateY(-1.5vh); }

  .eyebrow {
    font-size: 11px; letter-spacing: .66em; padding-left: .66em;
    color: var(--ink-dim); margin-bottom: 34px;
    animation: rise 2.4s ease both;
  }
  h1 {
    margin: 0; font-weight: 400;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size: clamp(40px, 7.2vw, 88px);
    letter-spacing: .32em; padding-left: .32em;
    text-shadow: 0 2px 46px rgba(255, 240, 200, .18), 0 1px 2px rgba(0, 0, 0, .3);
    animation: rise 2.8s .1s ease both;
  }
  .sub {
    margin: 32px 0 0; font-size: clamp(12.5px, 1.3vw, 15px);
    line-height: 2.2; letter-spacing: .24em; padding-left: .24em;
    color: rgba(246, 241, 226, .74);
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    animation: rise 3.2s .2s ease both;
  }
  #enter {
    margin-top: 48px; padding: 15px 44px 15px 48px;
    background: rgba(255, 249, 234, .06);
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); font-size: 13.5px; letter-spacing: .48em;
    font-family: inherit; cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .55s ease, border-color .55s ease, transform .55s ease;
    animation: rise 3.4s .3s ease both;
  }
  #enter:hover { background: rgba(255, 249, 234, .16); border-color: rgba(246, 241, 226, .56); transform: translateY(-1px); }

  /* 场景切换 */
  .scenes {
    margin-top: 26px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    animation: rise 3.5s .38s ease both;
  }
  .scene-label {
    font-size: 10px; letter-spacing: .3em; padding-left: .3em;
    color: rgba(246, 241, 226, .34);
    margin-right: 4px;
  }
  .scene {
    padding: 8px 18px 8px calc(18px + .3em);
    border: 1px solid rgba(246, 241, 226, .2);
    border-radius: 999px;
    background: transparent;
    color: rgba(246, 241, 226, .6);
    font-family: inherit; font-size: 11.5px; letter-spacing: .3em;
    cursor: pointer;
    transition: background .45s ease, color .45s ease, border-color .45s ease;
  }
  .scene:hover {
    color: var(--ink);
    border-color: rgba(246, 241, 226, .48);
    background: rgba(255, 249, 234, .08);
  }
  .scene.on {
    background: rgba(246, 241, 226, .84);
    color: #161a12;
    border-color: rgba(246, 241, 226, .84);
    cursor: default;
  }

  .tip {
    margin-top: 24px; font-size: 10.5px; letter-spacing: .24em;
    color: rgba(246, 241, 226, .34);
    animation: rise 3.6s .4s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 暂停 / 设置菜单 */
  #pause {
    background: rgba(9, 12, 8, .28);
    backdrop-filter: blur(9px) saturate(.92);
    z-index: 7;
    opacity: 0;
    transition: opacity .34s ease;
  }
  #pause.show { opacity: 1; }

  .menu {
    width: min(348px, 86vw);
    padding: 30px 26px 22px;
    border: 1px solid rgba(246, 241, 226, .16);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(21, 25, 18, .74), rgba(11, 14, 9, .84));
    box-shadow: 0 26px 70px rgba(0, 0, 0, .55);
    text-align: center;
  }
  .menu-title {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 20px; letter-spacing: .36em; padding-left: .36em;
    color: var(--ink); margin-bottom: 7px;
  }
  .menu-sub {
    font-size: 10.5px; letter-spacing: .2em; padding-left: .2em;
    color: rgba(246, 241, 226, .34); margin-bottom: 24px;
  }
  .menu-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 13px 16px 13px 18px; margin-bottom: 9px;
    border: 1px solid rgba(246, 241, 226, .14);
    border-radius: 9px;
    background: rgba(255, 252, 240, .03);
    color: rgba(246, 241, 226, .86);
    font-family: inherit; font-size: 12.5px; letter-spacing: .2em;
    cursor: pointer;
    transition: background .28s ease, border-color .28s ease, color .28s ease;
  }
  .menu-btn:hover {
    background: rgba(255, 252, 240, .09);
    border-color: rgba(246, 241, 226, .34);
    color: #fff;
  }
  .menu-btn .hint {
    font-size: 9.5px; letter-spacing: .12em;
    color: rgba(246, 241, 226, .32);
  }
  .menu-btn.primary {
    background: rgba(246, 241, 226, .86);
    color: #161a12; border-color: transparent;
  }
  .menu-btn.primary:hover { background: #f6f1e2; }
  .menu-btn.primary .hint { color: rgba(22, 26, 18, .5); }

  .panel { display: none; }
  .panel.on { display: block; }
  .panel-back {
    margin-top: 6px; padding: 9px;
    background: none; border: none;
    color: rgba(246, 241, 226, .38);
    font-family: inherit; font-size: 11px; letter-spacing: .2em;
    cursor: pointer; transition: color .24s ease;
  }
  .panel-back:hover { color: var(--ink); }

  /* 季节设置面板 */
  .season-label {
    font-size: 10.5px; letter-spacing: .24em; color: rgba(246, 241, 226, .42);
    margin: 14px 0 7px;
  }
  .season-label:first-child { margin-top: 0; }
  .season-row {
    display: flex; flex-wrap: wrap; gap: 7px;
  }
  .season-btn, .weather-btn {
    padding: 8px 14px;
    border: 1px solid rgba(246, 241, 226, .18); border-radius: 7px;
    background: rgba(255, 252, 240, .04);
    font-family: inherit; font-size: 12px; letter-spacing: .14em;
    color: var(--ink); cursor: pointer;
    transition: border-color .24s ease, background .24s ease;
  }
  .season-btn:hover, .weather-btn:hover {
    border-color: rgba(246, 241, 226, .5); background: rgba(255, 252, 240, .1);
  }
  .season-btn.active, .weather-btn.active {
    border-color: rgba(240, 217, 168, .7); background: rgba(240, 217, 168, .18); color: #f0d9a8;
  }
  .speed-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px 10px;
    border: 1px solid rgba(246, 241, 226, .12); border-radius: 7px;
    background: rgba(255, 252, 240, .03);
  }
  .speed-row input[type="range"] {
    width: 100%; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(246, 241, 226, .22); border-radius: 2px; outline: none;
  }
  .speed-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #f0d9a8; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(240, 217, 168, .22);
  }
  .speed-val {
    font-size: 11px; letter-spacing: .14em; color: rgba(246, 241, 226, .7);
    text-align: center;
  }

  /* 世界列表 */
  .world-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; margin-bottom: 9px; text-align: left;
    border: 1px solid rgba(246, 241, 226, .14); border-radius: 9px;
    cursor: pointer;
    transition: border-color .28s ease, background .28s ease;
  }
  .world-item:hover { border-color: rgba(246, 241, 226, .4); background: rgba(255, 252, 240, .06); }
  .world-item.cur {
    border-color: rgba(246, 241, 226, .46);
    background: rgba(246, 241, 226, .09);
    cursor: default;
  }
  .world-name { font-size: 13px; letter-spacing: .2em; }
  .world-desc { font-size: 10px; letter-spacing: .1em; color: rgba(246, 241, 226, .36); margin-top: 4px; }
  .world-tag { font-size: 9.5px; letter-spacing: .16em; color: rgba(246, 241, 226, .42); }

  /* 键位绑定 */
  .bind-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 3px;
    border-bottom: 1px solid rgba(246, 241, 226, .07);
  }
  .bind-label { font-size: 12px; letter-spacing: .18em; color: rgba(246, 241, 226, .7); }
  .bind-key {
    min-width: 96px; padding: 7px 12px;
    border: 1px solid rgba(246, 241, 226, .2); border-radius: 7px;
    background: rgba(255, 252, 240, .04);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11.5px; letter-spacing: .06em; color: var(--ink);
    cursor: pointer;
    transition: border-color .24s ease, background .24s ease, color .24s ease;
  }
  .bind-key:hover { border-color: rgba(246, 241, 226, .44); background: rgba(255, 252, 240, .09); }
  .bind-key.listening {
    border-color: #f0d9a8; color: #f0d9a8;
    animation: waitPulse 1.1s ease-in-out infinite;
  }
  @keyframes waitPulse { 0%, 100% { opacity: 1; } 50% { opacity: .42; } }

  /* 底部提示条 */
  .toast {
    position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%) translateY(10px);
    padding: 11px 22px; z-index: 9;
    border: 1px solid rgba(246, 241, 226, .16); border-radius: 999px;
    background: rgba(14, 18, 12, .84);
    backdrop-filter: blur(10px);
    font-size: 11.5px; letter-spacing: .18em;
    color: rgba(246, 241, 226, .8);
    opacity: 0; pointer-events: none;
    transition: opacity .34s ease, transform .34s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* HUD */
  #hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
  body.started #hud { opacity: 1; }
  body.clean #hud { opacity: 0; }
  .mark {
    position: absolute; top: 30px; left: 34px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size: 12.5px; letter-spacing: .32em;
    color: rgba(246, 241, 226, .52);
    display: flex; align-items: baseline; gap: 12px;
  }
  .mark span { font-size: 9.5px; letter-spacing: .26em; color: rgba(246, 241, 226, .3); }

  .clock {
    position: absolute; top: 30px; right: 36px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size: 11.5px; letter-spacing: .22em;
    color: rgba(246, 241, 226, .5);
    text-shadow: 0 1px 10px rgba(12, 20, 6, .34);
  }
  #wx {
    position: absolute; top: 52px; right: 36px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size: 10.5px; letter-spacing: .18em;
    color: rgba(246, 241, 226, .38);
    text-shadow: 0 1px 10px rgba(12, 20, 6, .34);
  }
  #wx .fest {
    color: rgba(255, 214, 140, .78);
  }

  /* 走到某处，地名浮一下 */
  .place {
    position: absolute; top: 15vh; left: 50%; transform: translateX(-50%);
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size: clamp(15px, 1.7vw, 21px);
    letter-spacing: .5em; padding-left: .5em; white-space: nowrap;
    color: rgba(255, 250, 235, .82);
    text-shadow: 0 2px 30px rgba(0, 0, 0, .5);
    opacity: 0; transition: opacity 2.2s ease;
  }
  .place.on { opacity: 1; }

  .keys {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 10.5px; letter-spacing: .17em; white-space: nowrap;
    color: rgba(255, 252, 240, .58);
    text-shadow: 0 1px 10px rgba(12, 20, 6, .7), 0 0 2px rgba(12, 20, 6, .5);
    transition: opacity 1.8s ease;
  }
  .keys.dim { opacity: 0; }

  .whisper {
    position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%);
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size: clamp(12.5px, 1.28vw, 15.5px);
    letter-spacing: .23em; padding-left: .23em; white-space: nowrap;
    color: rgba(255, 248, 230, .76);
    text-shadow: 0 2px 26px rgba(0, 0, 0, .5);
    opacity: 0; transition: opacity 2s ease;
  }
  .whisper.on { opacity: 1; }

  #fade {
    position: fixed; inset: 0; z-index: 9; pointer-events: none;
    background: #faf5e6; opacity: 0;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="grade"></div>

<div id="intro" class="layer">
  <div class="intro-inner">
    <div class="eyebrow">一片原野</div>
    <h1>理想的世界</h1>
    <p class="sub">这里没有任务，也没有尽头<br>风穿过草，湖在那边，门是开着的</p>
    <button id="enter">走进去</button>
    <div class="scenes" role="group" aria-label="切换场景">
      <span class="scene-label">场景</span>
      <button class="scene on" data-scene="wild" aria-current="true">原野</button>
      <button class="scene" data-scene="grass">草原</button>
    </div>
    <div class="tip">戴耳机 · 全屏 · 慢一点</div>
  </div>
</div>

<div id="pause" class="layer hidden">
  <div class="menu">
    <div class="menu-title">暂停</div>
    <div class="menu-sub">按 Esc 回到这里</div>

    <div class="panel on" id="panel-main">
      <button class="menu-btn primary" id="btn-resume">继续游戏</button>
      <button class="menu-btn" id="btn-season">季节设置</button>
      <button class="menu-btn" id="btn-world">切换世界<span class="hint">原野 / 草原</span></button>
      <button class="menu-btn" id="btn-keys">按键设置</button>
      <button class="menu-btn" id="btn-save">保存游戏<span class="hint">开发中</span></button>
      <button class="menu-btn" id="btn-quit">退出游戏</button>
    </div>

    <div class="panel" id="panel-world">
      <div class="world-item cur">
        <div><div class="world-name">原野</div><div class="world-desc">湖、木屋、黄昏与星空</div></div>
        <div class="world-tag">当前</div>
      </div>
      <div class="world-item" id="goto-grass">
        <div><div class="world-name">草原</div><div class="world-desc">农庄、牲畜、漫长的白天</div></div>
        <div class="world-tag">前往 →</div>
      </div>
      <button class="panel-back" data-back>← 返回</button>
    </div>

    <div class="panel" id="panel-keys">
      <div class="bind-row"><span class="bind-label">前进</span><button class="bind-key" data-bind="forward">W</button></div>
      <div class="bind-row"><span class="bind-label">后退</span><button class="bind-key" data-bind="back">S</button></div>
      <div class="bind-row"><span class="bind-label">左移</span><button class="bind-key" data-bind="left">A</button></div>
      <div class="bind-row"><span class="bind-label">右移</span><button class="bind-key" data-bind="right">D</button></div>
      <div class="bind-row"><span class="bind-label">快走</span><button class="bind-key" data-bind="run">Shift</button></div>
      <button class="panel-back" data-back>← 返回</button>
    </div>

    <div class="panel" id="panel-season">
      <div class="season-label">切换季节</div>
      <div class="season-row">
        <button class="season-btn" data-season="0">春</button>
        <button class="season-btn" data-season="1">夏</button>
        <button class="season-btn" data-season="2">秋</button>
        <button class="season-btn" data-season="3">冬</button>
      </div>
      <div class="season-label">四季轮转速度</div>
      <div class="speed-row">
        <input type="range" id="yearsec" min="60" max="7200" step="60" value="3600">
        <div class="speed-val" id="yearsec-val">1 小时 / 年</div>
      </div>
      <div class="season-label">天气（点击立即切换）</div>
      <div class="season-row">
        <button class="weather-btn" data-wx="clear">晴</button>
        <button class="weather-btn" data-wx="cloudy">多云</button>
        <button class="weather-btn" data-wx="overcast">阴</button>
        <button class="weather-btn" data-wx="rain">雨</button>
        <button class="weather-btn" data-wx="storm">雷雨</button>
        <button class="weather-btn" data-wx="snow">雪</button>
        <button class="weather-btn" data-wx="fog">雾</button>
      </div>
      <button class="panel-back" data-back>← 返回</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="hud">
  <div class="mark">理想的世界<span>原野</span></div>
  <div class="clock" id="clock">16:36 · 午后</div>
  <div id="wx">春 · 春分 · 晴</div>
  <div class="place" id="place"></div>
  <div class="whisper" id="whisper"></div>
  <div class="keys" id="keys">W A S D 走 · Shift 快走 · F 躺下 · T 换时辰 · M 声音 · H 净屏 · Esc 松手</div>
</div>

<div id="fade"></div>
<script>
/* 场景切换：本地双击用中文文件名，线上用 grassland.html */
(function () {
  const LINKS = location.protocol === 'file:'
    ? { wild: '理想的世界.html', grass: '草原.html' }
    : { wild: './', grass: './grassland.html' };
  const CURRENT = 'wild';
  const fade = document.getElementById('fade');
  document.querySelectorAll('.scene[data-scene]').forEach((btn) => {
    const key = btn.dataset.scene;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (key === CURRENT) return;
      fade.style.transition = 'opacity .6s ease';
      fade.style.opacity = '1';
      setTimeout(() => { location.href = LINKS[key]; }, 620);
    });
  });
})();
</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
